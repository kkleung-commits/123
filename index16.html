<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <!-- 讓手機、平板自動縮放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六合彩 隨機抽號器（響應式）</title>
    <style>
        /* ---------- 基本版面 ---------- */
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background:#f0f4f7;
            margin:0;
            padding:1rem;
            text-align:center;
            color:#2c3e50;
        }
        h1{
            margin:0.5rem 0 1rem;
        }
        button{
            padding:0.9rem 1.8rem;
            font-size:1rem;
            background:#2980b9;
            color:#fff;
            border:none;
            border-radius:6px;
            cursor:pointer;
            transition:background .2s;
        }
        button:hover{background:#1f6391;}

        /* ---------- 號碼顯示區 ---------- */
        #result{
            margin:2rem auto;
            display:flex;
            justify-content:center;
            flex-wrap:wrap;
            gap:0.8rem;               /* 手機間距較小，稍後會在 media query 中調整 */
        }
        .ball{
            width:3.5rem;            /* 手機預設較小 */
            height:3.5rem;
            line-height:3.5rem;
            border-radius:50%;
            background:#e67e22;
            color:#fff;
            font-size:1.2rem;
            font-weight:bold;
            box-shadow:0 3px 5px rgba(0,0,0,0.2);
        }
        .special{
            background:#27ae60;
        }

        .info{
            margin-top:1rem;
            font-size:0.9rem;
            color:#555;
        }

        /* ---------- 響應式調整 ---------- */
        @media (min-width: 480px) {      /* 大於 480px（大多數手機） */
            .ball{
                width:4rem;
                height:4rem;
                line-height:4rem;
                font-size:1.4rem;
            }
            #result{gap:1rem;}
        }
        @media (min-width: 768px) {      /* 平板、較大手機 */
            .ball{
                width:5rem;
                height:5rem;
                line-height:5rem;
                font-size:1.6rem;
            }
            button{
                padding:1rem 2rem;
                font-size:1.1rem;
            }
            #result{gap:1.2rem;}
        }
        @media (min-width: 1024px) {     /* 桌機、筆電 */
            .ball{
                width:6rem;
                height:6rem;
                line-height:6rem;
                font-size:1.8rem;
            }
            button{
                padding:1.2rem 2.4rem;
                font-size:1.2rem;
            }
            #result{gap:1.5rem;}
        }
    </style>
</head>
<body>
    <h1>六合彩 隨機抽號器</h1>
    <button id="drawBtn">抽取號碼</button>

    <div id="result"></div>

    <div class="info">
        <p>總號碼池：<strong>1‑49</strong>（共 49 個）</p>
        <p>每次抽出：6 個主號碼 + 1 個特別號碼（不重複）</p>
        <p>主號碼組合數：<strong>13,983,816</strong> 種</p>
        <p>完整抽獎結果組合數：<strong>601,302,088</strong> 種</p>
    </div>

    <script>
        // ---------- 抽號核心 ----------
        const pool = Array.from({length:49}, (_,i)=>i+1);   // 1~49

        function drawNumbers() {
            const numbers = pool.slice();   // 複製避免改變原始陣列

            // Fisher‑Yates 洗牌
            for (let i=numbers.length-1;i>0;i--) {
                const j = Math.floor(Math.random() * (i+1));
                [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
            }

            const main = numbers.slice(0,6).sort((a,b)=>a-b); // 前 6 個 → 主號碼
            const special = numbers[6];                     // 第 7 個 → 特別號碼

            return {main, special};
        }

        // ---------- UI 渲染 ----------
        function render({main, special}) {
            const container = document.getElementById('result');
            container.innerHTML = '';

            main.forEach(num=>{
                const div=document.createElement('div');
                div.className='ball';
                div.textContent=num;
                container.appendChild(div);
            });

            const sp=document.createElement('div');
            sp.className='ball special';
            sp.textContent=special;
            container.appendChild(sp);
        }

        // ---------- 事件 ----------
        document.getElementById('drawBtn')
                .addEventListener('click',()=>render(drawNumbers()));
    </script>
</body>
</html>
